<article class="card survivor-summary" id="survivorCard" aria-label="Main camera survivor detection">
  <div class="card-top"><h2>🧍 Survivors detected</h2><span class="pill" id="detectionState">Checking</span></div>
  <div class="metric" id="survivorCount">—</div>
  <p class="sensor-source" id="survivorSource">Main camera · Current frame</p>
  <p id="survivorHint" role="status">Connect the camera to begin detection.</p>
  <p class="muted">Confidence <strong id="survivorConf">—</strong> · Verify in main feed</p>
  <button id="sharedDetectionConnect" hidden>Connect main detector</button>
</article>
