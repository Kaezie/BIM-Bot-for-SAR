<dialog id="saveDialog" aria-labelledby="saveTitle">
  <h2 id="saveTitle">Saving your recording</h2>
  <p id="uploadStatus" role="status">Saving to this laptop…</p>
  <div class="dialog-actions">
    <button class="primary" id="retryUpload" hidden>Retry local save</button>
    <button id="downloadBtn">Download MP4 backup</button>
    <button id="closeSave" disabled>Done</button>
    <button class="danger-btn" id="discardBtn" hidden>Discard unsaved clip</button>
  </div>
</dialog>
<canvas id="recordCanvas" hidden></canvas>
